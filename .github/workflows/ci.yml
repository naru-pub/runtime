name: ci
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The runtime's own suites and types, the committed SDK build and metered
  # QuickJS against what their sources make now, and the SDK's specs.
  test:
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The committed SDK build is what its source emits now; a TypeScript or
      # Prettier bump that changes it shows up here rather than in a later
      # commit.
      - run: pnpm sdk:check
      - run: pnpm test:sdk
      # The committed metered QuickJS is what quickjs/meter makes of the
      # installed variant's WebAssembly. The meter's build is kept between
      # runs: compiled from nothing, it takes ~20s.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quickjs/meter -> target
      - run: pnpm check:meter

  # @naru-pub/sdk (sdk/), as a project installs it: packed as npm would
  # publish it, installed in an empty folder outside the checkout, imported
  # there, and its files compared with the ones Naru serves for its version.
  # publish-sdk.yml runs the same before publishing.
  sdk-package:
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sdk/scripts/check-package.sh "$RUNNER_TEMP/sdk"

  # @naru-pub/dev (dev/), as a developer installs it: built and packed once,
  # as npm would publish it and as publish-naru-dev.yml does, ...
  naru-dev-tarball:
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: dev
      - run: pnpm typecheck
        working-directory: dev
      - run: npm pack --silent --pack-destination .
        working-directory: dev
      - uses: actions/upload-artifact@v4
        with:
          name: naru-dev-tarball
          path: dev/naru-pub-dev-*.tgz
          retention-days: 7

  # ... then the tarball installed in an empty folder outside the checkout,
  # and its smoke test run there (the command on a fixture site's pages,
  # query, mutation, route and collection, and the testing API), on every
  # platform workerd ships a binary for, on the oldest Node it supports and
  # the current LTS.
  naru-dev-package:
    needs: naru-dev-tarball
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - ubuntu-26.04
          - macos-15
          - macos-15-intel
          - windows-2025
        node: [20, 24]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners check out CRLF otherwise, which bash can't run.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: naru-dev-tarball
          path: naru-dev-tarball
      - run: dev/scripts/check-package.sh "$PWD"/naru-dev-tarball/*.tgz
